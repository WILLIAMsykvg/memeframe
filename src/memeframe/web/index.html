<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>memeframe</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --ink: #1c1915;
      --muted: #6b645c;
      --line: #e4dccf;
      --card: #fffdf8;
      --accent: #c2410c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; }
    h1 { font-family: Palatino, "Palatino Linotype", "Songti SC", serif; font-size: 40px; line-height: 1; margin: 0; }
    h1 span { color: var(--accent); }
    .lang { border: 1px solid var(--ink); background: transparent; padding: 6px 10px; cursor: pointer; }
    p.lead { max-width: 62ch; color: var(--muted); }
    form.search, form.upload { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    input, button { font: inherit; color: inherit; }
    input[type="text"], input[type="search"] {
      flex: 1 1 220px;
      background: var(--card);
      border: 1px solid var(--ink);
      padding: 10px 12px;
    }
    button.primary { background: var(--ink); color: var(--bg); border: 1px solid var(--ink); padding: 10px 16px; cursor: pointer; }
    .sources { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 20px; }
    .sources button { border: 1px solid var(--line); background: var(--card); padding: 6px 10px; cursor: pointer; }
    .sources button.on { border-color: var(--accent); color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    article { background: var(--card); border: 1px solid var(--line); }
    article img { width: 100%; height: 180px; object-fit: cover; background: var(--bg); display: block; }
    article div { padding: 10px 12px 14px; }
    article h2 { font-size: 18px; margin: 0 0 4px; }
    article p { margin: 0; color: var(--muted); font-size: 14px; }
    .meta { margin-top: 8px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .actions { margin-top: 10px; }
    .actions button {
      border: 1px solid var(--line);
      background: transparent;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .note, .error { color: var(--muted); font-size: 14px; }
    .error { color: var(--accent); }
    section.upload, section.library { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 8px; }
    section.library h2, section.upload h2 { font-family: Palatino, "Palatino Linotype", "Songti SC", serif; font-size: 28px; }
    .actions button.danger { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>meme<span>frame</span></h1>
      <button class="lang" id="lang" type="button">English</button>
    </header>
    <p class="lead" id="lead"></p>
    <form class="search" id="search-form">
      <input id="q" type="search" name="q">
      <button class="primary" type="submit" id="search-btn"></button>
    </form>
    <div class="sources" id="sources"></div>
    <p class="error" id="error" hidden></p>
    <div class="grid" id="grid"></div>
    <p class="note" id="note"></p>
    <section class="upload">
      <h2 id="upload-title"></h2>
      <form class="upload" id="upload-form">
        <input id="file" type="file" accept="image/*,.svg" required>
        <input id="title" type="text">
        <input id="title-en" type="text">
        <input id="tags" type="text">
        <button class="primary" type="submit" id="upload-btn"></button>
      </form>
    </section>
    <section class="library">
      <h2 id="library-title"></h2>
      <p class="note" id="library-empty" hidden></p>
      <div class="grid" id="library-grid"></div>
    </section>
  </main>
  <script>
    const I18N = {
      zh: {
        lead: "按场景搜梗图。描述和向量在上传时写好，这次搜索不会再调用网络模型。",
        search: "搜索",
        placeholder: "例如：画饼、社死、无语的猫",
        uploadTitle: "上传到本地图库",
        title: "中文标题，例如 无语的猫",
        titleEn: "英文标题，例如 Speechless cat",
        tags: "标签，用逗号分隔",
        upload: "入库",
        note: "起步包是原创占位图。远程 JSON 源没配置时不会参与搜索。",
        empty: "没有匹配。换一种说法，或者先上传一张。",
        copy: "复制链接",
        copied: "已复制",
        libraryTitle: "本地图库",
        libraryEmpty: "还没有上传。入库之后会出现在这里，起步包不在这个列表里。",
        delete: "删除",
        confirmDelete: "确认删除",
        missing: "文件不在磁盘上",
        lang: "English",
        html: "zh"
      },
      en: {
        lead: "Search memes by scene. Captions and embeddings are written at upload, so this search does not call a network model.",
        search: "Search",
        placeholder: "Try: empty promise, awkward, speechless cat",
        uploadTitle: "Add to the local library",
        title: "Chinese title, for example 无语的猫",
        titleEn: "English title, for example speechless cat",
        tags: "Tags, separated by commas",
        upload: "Index",
        note: "The starter pack is original placeholder art. The HTTP JSON source stays out until you configure it.",
        empty: "No match. Try another scene, or upload an image.",
        copy: "Copy URL",
        copied: "Copied",
        libraryTitle: "Local library",
        libraryEmpty: "Nothing uploaded yet. Indexed images show up here. Starter images stay out of this list.",
        delete: "Delete",
        confirmDelete: "Confirm delete",
        missing: "File is missing from disk",
        lang: "中文",
        html: "en"
      }
    };

    const state = {
      lang: localStorage.getItem("memeframe-lang") || "zh",
      sources: [],
      selected: new Set(),
      searched: false,
      results: [],
      library: []
    };
    const text = (key) => I18N[state.lang][key];

    function applyCopy() {
      const copy = I18N[state.lang];
      document.documentElement.lang = copy.html;
      document.getElementById("lead").textContent = copy.lead;
      document.getElementById("q").placeholder = copy.placeholder;
      document.getElementById("search-btn").textContent = copy.search;
      document.getElementById("upload-title").textContent = copy.uploadTitle;
      document.getElementById("title").placeholder = copy.title;
      document.getElementById("title-en").placeholder = copy.titleEn;
      document.getElementById("tags").placeholder = copy.tags;
      document.getElementById("upload-btn").textContent = copy.upload;
      document.getElementById("note").textContent = copy.note;
      document.getElementById("library-title").textContent = copy.libraryTitle;
      document.getElementById("library-empty").textContent = copy.libraryEmpty;
      document.getElementById("lang").textContent = copy.lang;
    }

    function titleOf(meme) {
      return state.lang === "en" && meme.title_en ? meme.title_en : meme.title;
    }

    function captionOf(meme) {
      return state.lang === "en" && meme.caption_en ? meme.caption_en : meme.caption;
    }

    function absoluteUrl(url) {
      try {
        return new URL(url, window.location.origin).href;
      } catch {
        return url;
      }
    }

    function renderSources() {
      const box = document.getElementById("sources");
      box.innerHTML = "";
      state.sources.forEach((source) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = source.enabled ? source.name : source.name + " · off";
        button.disabled = !source.enabled;
        button.className = state.selected.has(source.id) ? "on" : "";
        button.addEventListener("click", () => {
          if (state.selected.has(source.id)) state.selected.delete(source.id);
          else state.selected.add(source.id);
          renderSources();
          runSearch(document.getElementById("q").value);
        });
        box.appendChild(button);
      });
    }

    function cardFor(meme, deletable) {
      const card = document.createElement("article");
      const img = document.createElement("img");
      img.src = meme.url;
      img.alt = titleOf(meme);
      const body = document.createElement("div");
      const heading = document.createElement("h2");
      heading.textContent = titleOf(meme);
      const caption = document.createElement("p");
      caption.textContent = captionOf(meme);
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = deletable
        ? meme.source_id + (meme.created_at ? " · " + meme.created_at.slice(0, 10) : "")
        : meme.source_id + " · " + meme.score;
      if (meme.on_disk === false) {
        const missing = document.createElement("p");
        missing.className = "error";
        missing.textContent = text("missing");
        body.append(heading, caption, meta, missing);
      } else {
        body.append(heading, caption, meta);
      }
      const actions = document.createElement("div");
      actions.className = "actions";
      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.textContent = text("copy");
      copyBtn.addEventListener("click", async () => {
        const link = absoluteUrl(meme.url);
        try {
          await navigator.clipboard.writeText(link);
          copyBtn.textContent = text("copied");
          setTimeout(() => { copyBtn.textContent = text("copy"); }, 1200);
        } catch {
          copyBtn.textContent = link;
        }
      });
      actions.appendChild(copyBtn);
      if (deletable) {
        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "danger";
        deleteBtn.textContent = text("delete");
        deleteBtn.addEventListener("click", () => removeLibraryMeme(meme, deleteBtn));
        actions.appendChild(deleteBtn);
      }
      body.append(actions);
      card.append(img, body);
      return card;
    }

    function renderMemes(memes) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      if (!memes.length) {
        const empty = document.createElement("p");
        empty.className = "note";
        empty.textContent = text("empty");
        grid.appendChild(empty);
        return;
      }
      memes.forEach((meme) => grid.appendChild(cardFor(meme, meme.source_id === "library")));
    }

    function renderLibrary() {
      const grid = document.getElementById("library-grid");
      const empty = document.getElementById("library-empty");
      grid.innerHTML = "";
      empty.hidden = state.library.length > 0;
      state.library.forEach((meme) => grid.appendChild(cardFor(meme, true)));
    }

    async function loadLibrary() {
      const response = await fetch("/api/library");
      const payload = await response.json();
      if (!response.ok) {
        const error = document.getElementById("error");
        error.hidden = false;
        error.textContent = payload.detail || "library failed";
        return;
      }
      state.library = payload.memes || [];
      renderLibrary();
    }

    async function removeLibraryMeme(meme, button) {
      if (button.dataset.armed !== "1") {
        button.dataset.armed = "1";
        button.textContent = text("confirmDelete");
        return;
      }
      button.disabled = true;
      const error = document.getElementById("error");
      const response = await fetch("/api/library/" + encodeURIComponent(meme.id), { method: "DELETE" });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        error.hidden = false;
        error.textContent = payload.detail || "delete failed";
        button.disabled = false;
        button.dataset.armed = "";
        button.textContent = text("delete");
        return;
      }
      error.hidden = true;
      await loadLibrary();
      await runSearch(document.getElementById("q").value);
    }

    async function runSearch(query) {
      const error = document.getElementById("error");
      error.hidden = true;
      const params = new URLSearchParams({ q: query || "" });
      if (state.selected.size) params.set("sources", [...state.selected].join(","));
      const response = await fetch("/api/search?" + params.toString());
      const payload = await response.json();
      if (!response.ok) {
        error.hidden = false;
        error.textContent = payload.detail || "search failed";
        return;
      }
      if (payload.errors && Object.keys(payload.errors).length) {
        error.hidden = false;
        error.textContent = JSON.stringify(payload.errors);
      }
      state.searched = true;
      state.results = payload.memes || [];
      renderMemes(state.results);
    }

    document.getElementById("lang").addEventListener("click", () => {
      state.lang = state.lang === "zh" ? "en" : "zh";
      localStorage.setItem("memeframe-lang", state.lang);
      applyCopy();
      if (state.searched) renderMemes(state.results);
      renderLibrary();
    });

    document.getElementById("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      runSearch(document.getElementById("q").value);
    });

    document.getElementById("upload-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("error");
      const body = new FormData();
      body.append("file", document.getElementById("file").files[0]);
      body.append("title", document.getElementById("title").value);
      body.append("title_en", document.getElementById("title-en").value);
      body.append("tags", document.getElementById("tags").value);
      const response = await fetch("/api/upload", { method: "POST", body });
      const payload = await response.json();
      if (!response.ok) {
        error.hidden = false;
        error.textContent = payload.detail || "upload failed";
        return;
      }
      document.getElementById("q").value = payload.title || "";
      await loadLibrary();
      runSearch(payload.title || "");
    });

    applyCopy();
    loadLibrary();
    fetch("/api/sources").then((response) => response.json()).then((payload) => {
      state.sources = payload.sources || [];
      renderSources();
      runSearch("");
    });
  </script>
</body>
</html>
